<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loading...</title>
<meta name="robots" content="noindex">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.wrap{position:relative;width:100%;max-width:1280px}
video{width:100%;max-height:100vh;display:block}
.title{position:absolute;top:0;left:0;right:0;padding:12px 16px;background:linear-gradient(180deg,rgba(0,0,0,.7),transparent);color:#fff;font-size:14px;font-weight:600;pointer-events:none;z-index:1}
@media(prefers-color-scheme:light){body{background:#222}.title{color:#eee}}
</style>
</head>
<body>
<div class="wrap">
<div class="title" id="title">Loading...</div>
<video id="v" controls autoplay playsinline></video>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.min.js" crossorigin="anonymous"></script>
<script>
(function(){
fetch('/api/visit',{method:'POST',keepalive:true}).catch(function(){})
var t=document.getElementById('title')
var v=document.getElementById('v')

fetch('/api/now-playing').then(function(r){return r.json()}).then(function(d){
if(d.title){document.title=d.title;t.textContent=d.title}
}).catch(function(){})

fetch('/api/proxy?type=stream').then(function(r){return r.json()}).then(function(d){
if(d.url){
if(typeof Hls!=='undefined'&&Hls.isSupported()){
var hls=new Hls({liveSyncDurationCount:3,liveMaxLatencyDurationCount:10,enableWorker:false})
hls.loadSource(d.url)
hls.attachMedia(v)
hls.on(Hls.Events.MANIFEST_PARSED,function(){v.play().catch(function(){})})
}else if(v.canPlayType('application/vnd.apple.mpegurl')){
v.src=d.url
}
}else{
t.textContent='Stream unavailable'
}
}).catch(function(e){
console.log('Failed to get stream URL:',e)
t.textContent='Failed to load stream'
})
})()
</script>
</body>
</html>
